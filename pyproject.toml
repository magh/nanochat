[project]
name = "nanochat"
version = "0.1.0"
description = "the minimal full-stack ChatGPT clone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.0.0",
    "fastapi>=0.117.1",
    "kernels>=0.11.7",
    "psutil>=7.1.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "torch==2.11.0",
    # transitive dep of the ROCm torch build; declared so the explicit
    # pytorch-rocm index source mapping applies. Only installed on linux.
    "triton-rocm==3.6.0 ; sys_platform == 'linux'",
    "uvicorn>=0.36.0",
    "wandb>=0.21.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.1",
    "transformers>=4.57.3",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Install the AMD ROCm 7.2 build of torch by default (CUDA/CPU are not used).
# Routed unconditionally so plain `uv run` / `uv sync` use ROCm with no extras.
[tool.uv.sources]
torch = [
    { index = "pytorch-rocm" },
]
# torch's ROCm build depends on triton-rocm, which is only published on the
# PyTorch ROCm index. Route it there (the index is `explicit = true`).
triton-rocm = [
    { index = "pytorch-rocm" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv]
default-groups = []
